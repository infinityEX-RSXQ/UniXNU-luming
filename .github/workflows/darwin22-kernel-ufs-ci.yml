name: luming darwin22 source kernel

on:
  workflow_dispatch:
    inputs:
      device_repository:
        description: "luming device repository (owner/name)"
        required: true
        default: "infinityEX-RSXQ/-UniXNU-luming"
      device_ref:
        description: "Device repository ref"
        required: true
        default: "main"
      with_geni:
        description: "Also apply the reviewed polled QCOM GENI UART console patch"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: luming-8796-source
  cancel-in-progress: false

env:
  DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1

jobs:
  kernel:
    runs-on: macos-15-intel
    timeout-minutes: 120
    steps:
      - name: Checkout reviewed Darwin22 base
        uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          ref: 75bc13dd34dc4e403826793739e316a264ce00dd
          path: base
          persist-credentials: false
      - name: Checkout luming device input
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.device_repository }}
          ref: ${{ inputs.device_ref }}
          path: device
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check fixed host and record actual tools
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/luming-host"
          {
            test -d "$DEVELOPER_DIR"
            echo "ImageOS=$ImageOS ImageVersion=$ImageVersion"
            sw_vers
            uname -m
            xcodebuild -version
            echo "DEVELOPER_DIR=$DEVELOPER_DIR"
            xcrun --sdk iphoneos --show-sdk-version
            xcrun --sdk iphoneos --show-sdk-path
            xcrun --sdk iphoneos clang --version
            xcrun --sdk iphoneos --find iig
            xcrun --sdk iphoneos --find mig
          } 2>&1 | tee "$RUNNER_TEMP/luming-host/toolchain.log"
      - name: Install base host dependencies
        run: brew install cmake ninja unifdef
      - name: Authenticate GitHub source downloads
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('base/scripts/prepare-xnu-source.py')
          text = path.read_text()
          text = text.replace('urllib.request.urlopen(', '_open(')
          helper = (
              'import urllib.request\n'
              '\n'
              '\n'
              'def _open(url, timeout=30):\n'
              '    import os as _os\n'
              '    request = urllib.request.Request(url)\n'
              '    token = _os.environ.get("GITHUB_TOKEN")\n'
              '    if token:\n'
              '        request.add_header("Authorization", "Bearer " + token)\n'
              '        request.add_header("Accept", "application/vnd.github+json")\n'
              '    return urllib.request.urlopen(request, timeout=timeout)\n'
          )
          text = text.replace('import urllib.request\n', helper, 1)
          path.write_text(text)
          print('patched authenticated GitHub downloads into base/scripts/prepare-xnu-source.py')
          PY

      - name: Validate fixed source inputs
        shell: bash
        env:
          GENI: ${{ inputs.with_geni }}
        run: |
          test "$(git -C base rev-parse HEAD)" = 75bc13dd34dc4e403826793739e316a264ce00dd
          ARGS=()
          if [ "$GENI" = "true" ]; then ARGS+=(--with-geni); fi
          python3 -B device/scripts/ci/build-8796-source.py --base base --check "${ARGS[@]}"
      - name: Compile and link 8796 source kernel
        shell: bash
        env:
          GENI: ${{ inputs.with_geni }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          ARGS=()
          if [ "$GENI" = "true" ]; then ARGS+=(--with-geni); fi
          python3 -u -B device/scripts/ci/build-8796-source.py --base base --with-ufs "${ARGS[@]}" \
            2>&1 | tee "$RUNNER_TEMP/luming-host/kernel-console.log"
      - name: Extract failure tail
        if: always()
        shell: bash
        run: |
          tail -n 2000 "$RUNNER_TEMP/luming-host/kernel-console.log" > "$RUNNER_TEMP/luming-host/failure-tail.txt" 2>/dev/null || true
      - name: Upload failure tail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: luming-darwin22-failure-tail-${{ inputs.with_geni && 'geni' || 'ufs' }}-${{ github.run_id }}
          path: ${{ runner.temp }}/luming-host/failure-tail.txt
          if-no-files-found: ignore
          retention-days: 7
      - name: Extract iOS16 storage ABI reference
        shell: bash
        run: |
          python3 -u -B "$GITHUB_WORKSPACE/device/scripts/ci/extract-storage-abi-8796.py"
      - name: Upload iOS16 storage ABI reference
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: luming-storage-abi-8796-${{ inputs.with_geni && 'geni' || 'ufs' }}-${{ github.run_id }}
          path: ${{ runner.temp }}/nuwa-8796-source/reports/storage-abi-8796/**
          if-no-files-found: error
          retention-days: 7
      - name: Upload Darwin22 kernel
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: luming-darwin22-kernel-${{ inputs.with_geni && 'geni' || 'ufs' }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/nuwa-8796-source/build/xnu/ios-obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837.unstripped
            ${{ runner.temp }}/nuwa-8796-source/reports/build.json
          if-no-files-found: error
          retention-days: 7
